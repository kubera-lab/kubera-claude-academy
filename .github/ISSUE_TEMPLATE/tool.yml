name: Tool improvement
description: A final-project tool misses a rule or gives a false finding
labels: [tool]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options: [Safety Review, Prompt A/B Tester, Own assistant (course 3), Agent Trace Debugger, CSV Auditor, SQL Report Builder, GeoJSON Validator, Web Quality Inspector]
    validations: { required: true }
  - type: textarea
    id: input
    attributes: { label: Smallest input that shows the problem, render: text }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected finding vs actual finding }
    validations: { required: true }
